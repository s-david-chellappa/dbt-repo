version: 2

sources:
  - name: landing
    database: LZ
    schema: RAW
    description: Raw retail data landing zone
    tables:
      - name: customers
        description: Raw customer records
        columns:
          - name: customer_id
            description: Primary key for customers
      - name: products
        description: Raw product catalog
        columns:
          - name: product_id
            description: Primary key for products
      - name: stores
        description: Raw store information
        columns:
          - name: store_id
            description: Primary key for stores
      - name: employees
        description: Raw employee records
        columns:
          - name: employee_id
            description: Primary key for employees
      - name: suppliers
        description: Raw supplier information
        columns:
          - name: supplier_id
            description: Primary key for suppliers
      - name: dates
        description: Pre-built date dimension source
        columns:
          - name: date_key
            description: Surrogate key YYYYMMDD
      - name: times
        description: Time dimension source
        columns:
          - name: time_key
            description: Surrogate key HHMM
      - name: locations
        description: Geographic location reference
        columns:
          - name: location_id
            description: Primary key for locations
      - name: categories
        description: Product category hierarchy
        columns:
          - name: category_id
            description: Primary key for categories
      - name: brands
        description: Product brand reference
