      - name: warehouses
        description: Warehouse locations
        columns:
          - name: warehouse_id
            description: Primary key for warehouses
      - name: currencies
        description: Currency reference
        columns:
          - name: currency_id
            description: Primary key for currencies
      - name: seasons
